<body class="bg-gray-50 text-gray-900">
  <div id="root"></div>

  <!-- type="text/plain" here on purpose: Babel standalone's automatic page
     scanner (transformScriptTags) walks every <script> tag on the page
     looking for ones to compile, and in this environment that scan was
     tripping over one of the OTHER CDN scripts above (React/Tailwind),
     throwing "Cannot use import statement outside a module" before it
     ever got to our own code. Giving our script a type Babel's scanner
     doesn't recognize keeps it out of that auto-scan entirely — we then
     compile and run it ourselves, deterministically, right below. -->
  <script type="text/plain" id="app-source">
const { useState, useEffect, useRef, useCallback } = React;

// ---------------------------------------------------------------------
// API + history helpers
// ---------------------------------------------------------------------
async function api(path, body) {
  const r = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  return r.json();
}

const HISTORY_KEY = "ilovyt_history_v1";
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
  catch (e) { return []; }
}
function useHistory() {
  const [history, setHistory] = useState(loadHistory);
  const addHistory = useCallback((entry) => {
    setHistory(prev => {
      const next = [{ ...entry, ts: Date.now() }, ...prev].slice(0, 30);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(next));
      return next;
    });
  }, []);
  const clearHistory = useCallback(() => {
    localStorage.removeItem(HISTORY_KEY);
    setHistory([]);
  }, []);
  return { history, addHistory, clearHistory };
}

function downloadTextFile(filename, text) {
  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

}

// A single hook that gives every action panel the same behavior:
// - one in-flight request at a time
// - result/error clear automatically the instant any input changes,
//   so switching e.g. MP4 -> MP3 never leaves a stale MP4 link on screen
function useAction(deps) {
  const [status, setStatus] = useState("idle"); // idle | loading | done | error
  const [result, setResult] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => {
    setResult(null); setError(""); setStatus("idle");
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, deps);

  const run = useCallback(async (fn) => {
    if (status === "loading") return;
    setStatus("loading"); setError("");
    try {
      const data = await fn();
      if (data && data.error) { setStatus("error"); setError(data.error); return null; }
      setResult(data);
      setStatus("done");
      return data;
    } catch (e) {
      setStatus("error"); setError(String(e));
      return null;
    }
  }, [status]);

  return { status, result, error, run, disabled: status === "loading" || status === "done" };
}

// ---------------------------------------------------------------------
// Download
// ---------------------------------------------------------------------
function DownloadPanel({ addHistory, prefillUrl }) {
  const [url, setUrl] = useState(prefillUrl || "");
  const [format, setFormat] = useState("mp4");
  const [quality, setQuality] = useState("best");
  useEffect(() => { if (prefillUrl) setUrl(prefillUrl); }, [prefillUrl]);

  const { status, result, error, run, disabled } = useAction([url, format, quality]);

  async function go() {
    const data = await run(() => api("/api/download", { url, format, quality }));
    if (data) addHistory({ type: `Download (${format.toUpperCase()})`, title: url });
  }

  return (
    <Card className="max-w-2xl">
      <h2 className="font-bold text-lg mb-4">⬇️ Download</h2>
      <TextInput value={url} onChange={e => setUrl(e.target.value)} placeholder="Video or playlist URL" className="mb-3" />
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
        <Select value={format} onChange={e => setFormat(e.target.value)}>
          <option value="mp4">MP4 (video)</option>
          <option value="mp3">MP3 (audio only)</option>
        </Select>
        <Select value={quality} onChange={e => setQuality(e.target.value)} disabled={format === "mp3"}>
          <option value="best">Best quality</option>
          <option value="1080p">1080p</option>
          <option value="720p">720p</option>
          <option value="480p">480p</option>
        </Select>
      </div>
      <PrimaryButton onClick={go} disabled={disabled || !url}>
        {status === "loading" ? <Spinner label="Downloading..." /> : status === "done" ? "Done — edit above to run again" : "Download"}
      </PrimaryButton>
      {error && <ErrorBox>{error}</ErrorBox>}
      {result && <DownloadLinks files={result.files} />}
    </Card>
  );
}

// ---------------------------------------------------------------------
// Video Info
// ---------------------------------------------------------------------
function InfoPanel({ addHistory }) {
  const [url, setUrl] = useState("");
  const { status, result, error, run, disabled } = useAction([url]);
  const dl = useAction([url, "mp4"]);
  const dl3 = useAction([url, "mp3"]);

  async function go() {
    const data = await run(() => api("/api/info", { url }));
    if (data) addHistory({ type: "Video Info", title: data.title || url });
  }
  async function goDownload(fmt) {
    const a = fmt === "mp4" ? dl : dl3;
    const data = await a.run(() => api("/api/download", { url, format: fmt, quality: "best" }));
    if (data) addHistory({ type: `Download (${fmt.toUpperCase()})`, title: url });
  }

  return (
    <Card className="max-w-2xl">
      <h2 className="font-bold text-lg mb-4">ℹ️ Video Info</h2>
      <TextInput value={url} onChange={e => setUrl(e.target.value)} placeholder="Video URL" className="mb-3" />
      <div className="flex flex-wrap gap-2">
        <PrimaryButton onClick={go} disabled={disabled || !url}>
          {status === "loading" ? <Spinner label="Loading..." /> : status === "done" ? "Done — edit URL to reload" : "Get Info"}
        </PrimaryButton>
        <SecondaryButton onClick={() => goDownload("mp4")} disabled={dl.disabled || !url}>
          {dl.status === "loading" ? <Spinner label="..." /> : "Download MP4"}
        </SecondaryButton>
        <SecondaryButton onClick={() => goDownload("mp3")} disabled={dl3.disabled || !url}>
          {dl3.status === "loading" ? <Spinner label="..." /> : "Download MP3"}
        </SecondaryButton>
      </div>
      {error && <ErrorBox>{error}</ErrorBox>}
      {dl.error && <ErrorBox>{dl.error}</ErrorBox>}
      {dl3.error && <ErrorBox>{dl3.error}</ErrorBox>}
      {dl.result && <DownloadLinks files={dl.result.files} />}
      {dl3.result && <DownloadLinks files={dl3.result.files} />}

      {result && (
        <div className="mt-4 pt-4 border-t border-gray-100">
          <div className="font-bold">{result.title}</div>
          <div className="text-sm text-gray-500 mt-1">{result.channel} · {result.duration_str} · {result.upload_date}</div>
          <div className="text-sm mt-2">Views: {result.view_count ?? "n/a"} · Likes: {result.like_count ?? "n/a"} · Comments: {result.comment_count ?? "n/a"}</div>
          <div className="text-xs text-gray-400 mt-1">Captions available: {String(result.has_captions)}</div>
          <pre className="mt-3 text-xs bg-gray-50 border border-gray-100 rounded-lg p-3 max-h-64 overflow-auto whitespace-pre-wrap">{(result.description || "").slice(0, 1000)}</pre>
        </div>
      )}
    </Card>
  );
}

// ---------------------------------------------------------------------
// Transcript
// ---------------------------------------------------------------------
function TranscriptPanel({ addHistory, prefillUrl }) {
  const [url, setUrl] = useState(prefillUrl || "");
  const [timestamps, setTimestamps] = useState(false);
  useEffect(() => { if (prefillUrl) setUrl(prefillUrl); }, [prefillUrl]);
  const { status, result, error, run, disabled } = useAction([url, timestamps]);

  async function go() {
    const data = await run(() => api("/api/transcript", { url, timestamps }));
    if (data && data.available === false) { return; }
    if (data) addHistory({ type: "Transcript", title: url });
  }

  return (
    <Card className="max-w-2xl">
      <h2 className="font-bold text-lg mb-4">📝 Transcript</h2>
      <TextInput value={url} onChange={e => setUrl(e.target.value)} placeholder="Video URL" className="mb-3" />
      <label className="flex items-center gap-2 text-sm text-gray-600 mb-4">
        <input type="checkbox" checked={timestamps} onChange={e => setTimestamps(e.target.checked)} />
        Include timestamps
      </label>
      <PrimaryButton onClick={go} disabled={disabled || !url}>
        {status === "loading" ? <Spinner label="Loading..." /> : status === "done" ? "Done — edit above to fetch again" : "Get Transcript"}
      </PrimaryButton>
      {error && <ErrorBox>{error}</ErrorBox>}
      {result && result.available === false && <ErrorBox>{result.reason}</ErrorBox>}
      {result && result.available && (
        <div className="mt-4">
          <div className="text-xs text-gray-400 mb-2">{result.language} ({result.is_generated ? "auto-generated" : "manual"})</div>
          <pre className="text-xs bg-gray-50 border border-gray-100 rounded-lg p-3 max-h-80 overflow-auto whitespace-pre-wrap">{result.text}</pre>
          <SecondaryButton className="mt-3" onClick={() => downloadTextFile("transcript.txt", result.text)}>
            ⬇️ Download transcript (.txt)
          </SecondaryButton>
        </div>
      )}
    </Card>
  );
}

// ---------------------------------------------------------------------
// AI Summary (fetches transcript, then summarizes)
// ---------------------------------------------------------------------
function SummaryPanel({ addHistory, prefillUrl }) {
  const [url, setUrl] = useState(prefillUrl || "");
  useEffect(() => { if (prefillUrl) setUrl(prefillUrl); }, [prefillUrl]);
  const { status, result, error, run, disabled } = useAction([url]);

  // Both steps (transcript fetch + summarize) now happen INSIDE run(), so
  // status flips to "loading" the instant the button is clicked — not
  // after the transcript fetch (which can take a few seconds on its own)
  // has already finished. That's what made the spinner appear "late".
  async function go() {
    const data = await run(async () => {
      const t = await api("/api/transcript", { url });
      if (t.error || t.available === false) {
        return { error: t.error || t.reason };
      }
      return api("/api/summarize", { text: t.text });
    });
    if (data) addHistory({ type: "AI Summary", title: url });
  }

  return (
    <Card className="max-w-2xl">
      <h2 className="font-bold text-lg mb-4">✨ AI Summary</h2>
      <p className="text-sm text-gray-500 mb-3">Pulls the transcript automatically, then summarizes it with your configured AI provider (Gemini or Ollama — set in <code>.env</code>).</p>
      <TextInput value={url} onChange={e => setUrl(e.target.value)} placeholder="Video URL" className="mb-4" />
      <PrimaryButton onClick={go} disabled={disabled || !url}>
        {status === "loading" ? <Spinner label="Summarizing..." /> : status === "done" ? "Done — edit URL to summarize again" : "Summarize"}
      </PrimaryButton>
      {error && <ErrorBox>{error}</ErrorBox>}
      {result && result.summary && (
        <div className="mt-4">
          <div
            className="prose prose-sm prose-purple max-w-none bg-purple-50 border border-purple-100 rounded-lg p-4 max-h-96 overflow-auto"
            dangerouslySetInnerHTML={{ __html: marked.parse(result.summary) }}
          />
          <div className="mt-3 flex gap-2">
            <SecondaryButton onClick={() => downloadTextFile("summary.md", result.summary)}>
              ⬇️ Download (.md)
            </SecondaryButton>
            <SecondaryButton onClick={() => downloadTextFile("summary.txt", result.summary)}>
              ⬇️ Download (.txt)
            </SecondaryButton>
          </div>
        </div>
      )}
    </Card>
  );
}

// ---------------------------------------------------------------------
// Playlist
// ---------------------------------------------------------------------
function PlaylistRow({ video, addHistory, goTranscript, goSummary }) {
  const dl = useAction([video.url]);

  async function download(fmt) {
    const data = await dl.run(() => api("/api/download", { url: video.url, format: fmt, quality: "best" }));
    if (data) addHistory({ type: `Download (${fmt.toUpperCase()})`, title: video.title });
  }

  return (
    <div className="px-3 sm:px-4 py-3 border-b border-gray-50 last:border-0">
      <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 sm:gap-3">
        <div className="min-w-0 flex-1">
          <div className="text-sm font-medium truncate">{video.title}</div>
          <div className="text-xs text-gray-400">{video.duration_str}</div>
        </div>
        <div className="flex flex-wrap gap-1.5 shrink-0">
          <SecondaryButton className="!px-2.5 !py-1 text-xs" onClick={() => download("mp4")} disabled={dl.disabled}>
            {dl.status === "loading" ? "..." : "MP4"}
          </SecondaryButton>
          <SecondaryButton className="!px-2.5 !py-1 text-xs" onClick={() => download("mp3")} disabled={dl.disabled}>
            {dl.status === "loading" ? "..." : "MP3"}
          </SecondaryButton>
          <SecondaryButton className="!px-2.5 !py-1 text-xs" onClick={() => goTranscript(video.url)}>Transcript</SecondaryButton>
          <SecondaryButton className="!px-2.5 !py-1 text-xs" onClick={() => goSummary(video.url)}>Summary</SecondaryButton>
        </div>
      </div>
      {dl.error && <div className="text-xs text-red-600 mt-1">{dl.error}</div>}
      {dl.result && <DownloadLinks files={dl.result.files} />}
    </div>
  );
}

function PlaylistPanel({ addHistory, setTab, setTranscriptPrefill, setSummaryPrefill }) {
  const [url, setUrl] = useState("");
  const { status, result, error, run, disabled } = useAction([url]);

  const [format, setFormat] = useState("json");
  const [includeTranscript, setIncludeTranscript] = useState(true);
  const [includeSummary, setIncludeSummary] = useState(false);
  const [dlFormat, setDlFormat] = useState("none");
  const report = useAction([url, format, includeTranscript, includeSummary, dlFormat]);

  async function load() {
    const data = await run(() => api("/api/playlist", { url }));
    if (data) addHistory({ type: "Playlist", title: data.playlist_title || url });
  }

  async function generateReport() {
    const data = await report.run(() => api("/api/playlist/report", {
      url, include_transcript: includeTranscript, include_summary: includeSummary, format,
    }));
    if (data && dlFormat !== "none") {
      await api("/api/download", { url, format: dlFormat, quality: "best" });
    }
  }

  function goTranscript(videoUrl) { setTranscriptPrefill(videoUrl); setTab("transcript"); }
  function goSummary(videoUrl) { setSummaryPrefill(videoUrl); setTab("summary"); }

  return (
    <div className="max-w-3xl space-y-5">
      <Card>
        <h2 className="font-bold text-lg mb-4">📋 Playlist</h2>
        <TextInput value={url} onChange={e => setUrl(e.target.value)} placeholder="Playlist URL" className="mb-3" />
        <PrimaryButton onClick={load} disabled={disabled || !url}>
          {status === "loading" ? <Spinner label="Loading..." /> : status === "done" ? "Done — edit URL to reload" : "Load Playlist"}
        </PrimaryButton>
        {error && <ErrorBox>{error}</ErrorBox>}
      </Card>

      {result && (
        <React.Fragment>
          <Card className="!p-0 overflow-hidden">
            <div className="px-5 py-4 border-b border-gray-100">
              <div className="font-bold">{result.playlist_title}</div>
              <div className="text-xs text-gray-400">{result.video_count} videos · total {result.total_duration_str}</div>
            </div>
            <div className="max-h-[28rem] overflow-auto">
              {result.videos.map((v, i) => (
                <PlaylistRow key={i} video={v} addHistory={addHistory} goTranscript={goTranscript} goSummary={goSummary} />
              ))}
            </div>
          </Card>

          <Card>
            <div className="font-semibold text-sm mb-3">Export a combined report</div>
            <p className="text-xs text-gray-500 mb-3">Can take a while for long playlists, more with summaries on (one AI call per video).</p>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
              <Select value={format} onChange={e => setFormat(e.target.value)}>
                <option value="json">JSON</option>
                <option value="csv">CSV</option>
                <option value="md">Markdown</option>
              </Select>
              <Select value={dlFormat} onChange={e => setDlFormat(e.target.value)}>
                <option value="none">Don't download videos</option>
                <option value="mp3">Also download all as MP3</option>
                <option value="mp4">Also download all as MP4</option>
              </Select>
            </div>
            <label className="flex items-center gap-2 text-sm text-gray-600 mb-2">
              <input type="checkbox" checked={includeTranscript} onChange={e => setIncludeTranscript(e.target.checked)} />
              Include transcripts
            </label>
            <label className="flex items-center gap-2 text-sm text-gray-600 mb-4">
              <input type="checkbox" checked={includeSummary} onChange={e => setIncludeSummary(e.target.checked)} />
              Include AI summaries (slower)
            </label>
            <PrimaryButton onClick={generateReport} disabled={report.disabled}>
              {report.status === "loading" ? <Spinner label="Building report..." /> : report.status === "done" ? "Done — change options to run again" : "Generate Report"}
            </PrimaryButton>
            {report.error && <ErrorBox>{report.error}</ErrorBox>}
            {report.result && (
              <div className="mt-3">
                <a href={report.result.url} download className="text-sm font-medium text-green-700 bg-green-50 border border-green-200 rounded-lg px-3 py-2 inline-block hover:bg-green-100 transition">
                  ✅ {report.result.file}
                </a>
              </div>
            )}
          </Card>
        </React.Fragment>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------
// History
// ---------------------------------------------------------------------
function HistoryPanel({ history, clearHistory }) {
  return (
    <Card className="max-w-2xl !p-0 overflow-hidden">
      <div className="flex items-center justify-between px-5 py-4 border-b border-gray-100">
        <h2 className="font-bold text-lg">🕑 History</h2>
        {history.length > 0 && (
          <button onClick={clearHistory} className="text-sm text-red-500 hover:underline">Clear All</button>
        )}
      </div>
      {history.length === 0 ? (
        <div className="px-5 py-8 text-sm text-gray-400 text-center">Nothing here yet — actions you run will show up in this list.</div>
      ) : (
        <div className="divide-y divide-gray-50 max-h-[32rem] overflow-auto">
          {history.map((h, i) => (
            <div key={i} className="flex items-center justify-between px-5 py-3">
              <div className="min-w-0 flex-1">
                <div className="text-sm truncate">{h.title}</div>
                <div className="text-xs text-gray-400">{new Date(h.ts).toLocaleString()}</div>
              </div>
              <span className="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full shrink-0 ml-3">{h.type}</span>
            </div>
          ))}
        </div>
      )}
    </Card>
  );
}

// ---------------------------------------------------------------------
// App
// ---------------------------------------------------------------------
function App() {
  const [tab, setTab] = useState("home");
  const { history, addHistory, clearHistory } = useHistory();
  const [downloadPrefill, setDownloadPrefill] = useState("");
  const [transcriptPrefill, setTranscriptPrefill] = useState("");
  const [summaryPrefill, setSummaryPrefill] = useState("");
  const [sidebarOpen, setSidebarOpen] = useState(false);

  return (
    <div className="lg:flex min-h-screen">
      <Sidebar tab={tab} setTab={setTab} open={sidebarOpen} setOpen={setSidebarOpen} />
      <div className="flex-1 min-w-0 flex flex-col">
        <MobileTopBar onOpen={() => setSidebarOpen(true)} />
        <main className="flex-1 p-4 sm:p-6 lg:p-8 overflow-x-hidden">
          {tab === "home" && <Home setTab={setTab} prefillDownload={setDownloadPrefill} history={history} />}
          {tab === "download" && <DownloadPanel addHistory={addHistory} prefillUrl={downloadPrefill} />}
          {tab === "info" && <InfoPanel addHistory={addHistory} />}
          {tab === "playlist" && (
            <PlaylistPanel
              addHistory={addHistory}
              setTab={setTab}
              setTranscriptPrefill={setTranscriptPrefill}
              setSummaryPrefill={setSummaryPrefill}
            />
          )}
          {tab === "transcript" && <TranscriptPanel addHistory={addHistory} prefillUrl={transcriptPrefill} />}
          {tab === "summary" && <SummaryPanel addHistory={addHistory} prefillUrl={summaryPrefill} />}
          {tab === "history" && <HistoryPanel history={history} clearHistory={clearHistory} />}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
  <script>
      // Manually compile the JSX above and run it — see the comment on the
      // #app-source tag for why this replaces Babel's automatic script scan.
      (function () {
        const source = document.getElementById("app-source").textContent;
        // { runtime: "classic" } forces old-style React.createElement(...) output
        // instead of the "automatic" runtime's default, which emits
        // `import { jsx as _jsx } from "react/jsx-runtime"` at the top of the
        // compiled code — that import is what was breaking execution, since
        // there's no bundler here to resolve it. Classic runtime needs nothing
        // but the global `React` we already load via the UMD script tag.
        const compiled = Babel.transform(source, {
          presets: [["react", { runtime: "classic" }]],
        }).code;
        const s = document.createElement("script");
        s.textContent = compiled;
        document.body.appendChild(s);
      })();
  </script>
</body>
