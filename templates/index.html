<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ILoveYT 💛</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1c202b; --border:#262b36;
    --text:#e6e8ee; --muted:#8b92a3;
    --accent:#ff5c8a; --accent2:#6ea8fe; --accent3:#7ee8b6;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:2rem; color:var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(120deg, #0f1115, #1a1030, #0f1115, #101a2e);
    background-size: 300% 300%;
    animation: bgShift 18s ease infinite;
    min-height: 100vh;
  }
  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes fadeUp { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes pop { 0% { transform:scale(.8); opacity:0; } 100% { transform:scale(1); opacity:1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes heartBeat { 0%,100% { transform:scale(1); } 25% { transform:scale(1.2); } 40% { transform:scale(1); } }

  .wrap { max-width: 880px; margin: 0 auto; animation: fadeUp .5s ease; }

  header.hero { display:flex; align-items:center; gap:.75rem; margin-bottom:.35rem; }
  .logo {
    font-size:1.9rem; display:inline-block;
    animation: heartBeat 2.4s ease-in-out infinite;
  }
  h1 {
    font-size: 1.7rem; margin:0; font-weight:800; letter-spacing:-.02em;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: bgShift 6s linear infinite;
  }
  .sub { color: var(--muted); margin: .35rem 0 1.5rem; font-size: .92rem; }

  .tabs { display:flex; gap:.5rem; margin-bottom:1rem; flex-wrap:wrap; }
  .tab {
    padding:.55rem 1.1rem; background:var(--panel); border:1px solid var(--border);
    border-radius:999px; cursor:pointer; font-size:.9rem; transition: all .18s ease;
  }
  .tab:hover { transform: translateY(-2px); border-color: var(--accent2); }
  .tab.active {
    border-color: var(--accent); color:#fff;
    background: linear-gradient(90deg, rgba(255,92,138,.25), rgba(110,168,254,.25));
    box-shadow: 0 4px 14px rgba(255,92,138,.15);
  }

  .panel {
    display:none; background:var(--panel);
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border:1px solid var(--border); border-radius:16px; padding:1.4rem;
    box-shadow: 0 8px 30px rgba(0,0,0,.25);
  }
  .panel.active { display:block; animation: fadeUp .35s ease; }

  input[type=text], select {
    width:100%; padding:.65rem .8rem; background:#0b0d12; border:1px solid var(--border);
    border-radius:10px; color:var(--text); font-size:.9rem; margin-bottom:.75rem;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input[type=text]:focus, select:focus {
    outline:none; border-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(110,168,254,.15);
  }
  .row { display:flex; gap:.5rem; }
  .row > * { flex:1; }

  button {
    padding:.65rem 1.2rem; background: linear-gradient(90deg, var(--accent), var(--accent2));
    color:#0f1115; border:none; border-radius:10px; font-weight:700; cursor:pointer;
    font-size:.9rem; transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(255,92,138,.25); }
  button:active:not(:disabled) { transform: translateY(0) scale(.98); }
  button.secondary {
    background:transparent; border:1px solid var(--border); color:var(--text);
  }
  button.secondary:hover:not(:disabled) { border-color: var(--accent2); }
  button:disabled { opacity:.5; cursor:default; transform:none; box-shadow:none; }

  pre {
    white-space:pre-wrap; word-break:break-word; background:#0b0d12; padding:1rem;
    border-radius:10px; border:1px solid var(--border); max-height:420px; overflow:auto;
    font-size:.85rem; animation: fadeUp .3s ease;
  }
  table { width:100%; border-collapse: collapse; font-size:.85rem; margin-top:.75rem; }
  td, th { text-align:left; padding:.45rem .3rem; border-bottom:1px solid var(--border); }
  tr:hover td { background: rgba(255,255,255,.02); }
  .muted { color:var(--muted); font-size:.85rem; }
  .result { margin-top:1rem; }
  .result a { color: var(--accent3); text-decoration:none; font-weight:600; }
  .result a:hover { text-decoration: underline; }
  .checkbox-row { display:flex; align-items:center; gap:.5rem; margin-bottom:.75rem; font-size:.85rem; color:var(--muted); }

  .spinner {
    display:inline-block; width:14px; height:14px; border-radius:50%;
    border:2px solid rgba(255,255,255,.25); border-top-color: var(--accent);
    animation: spin .7s linear infinite; vertical-align:middle; margin-right:.4rem;
  }
  .success-pop { animation: pop .3s ease; }

  footer {
    text-align:center; color:var(--muted); font-size:.8rem; margin-top:2rem; padding-bottom:1rem;
  }
  footer .heart { display:inline-block; animation: heartBeat 1.8s ease-in-out infinite; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="logo">💛</span>
    <h1>ILoveYT</h1>
  </header>
  <div class="sub">Your own YouTube toolkit — download, transcripts, playlists & AI summaries, all in one place.</div>

  <div class="tabs">
    <div class="tab active" data-tab="download">⬇️ Download</div>
    <div class="tab" data-tab="info">🎬 Video Info</div>
    <div class="tab" data-tab="playlist">📋 Playlist</div>
    <div class="tab" data-tab="transcript">📝 Transcript</div>
  </div>

  <!-- DOWNLOAD -->
  <div class="panel active" id="panel-download">
    <input type="text" id="dl-url" placeholder="Video or playlist URL">
    <div class="row">
      <select id="dl-format">
        <option value="mp4">MP4 (video)</option>
        <option value="mp3">MP3 (audio only)</option>
      </select>
      <select id="dl-quality">
        <option value="best">Best quality</option>
        <option value="1080p">1080p</option>
        <option value="720p">720p</option>
        <option value="480p">480p</option>
      </select>
    </div>
    <button id="dl-btn" onclick="doDownload()">Download</button>
    <div class="result" id="dl-result"></div>
  </div>

  <!-- INFO -->
  <div class="panel" id="panel-info">
    <input type="text" id="info-url" placeholder="Video URL">
    <div class="row">
      <button id="info-btn" onclick="doInfo()">Get Info</button>
      <button id="info-dl-mp4-btn" class="secondary" onclick="doInfoDownload('mp4')">Download MP4</button>
      <button id="info-dl-mp3-btn" class="secondary" onclick="doInfoDownload('mp3')">Download MP3</button>
    </div>
    <div class="result" id="info-result"></div>
  </div>

  <!-- PLAYLIST -->
  <div class="panel" id="panel-playlist">
    <input type="text" id="pl-url" placeholder="Playlist URL">
    <button onclick="doPlaylist()">Load Playlist</button>
    <div class="result" id="pl-result"></div>

    <div id="pl-export" style="display:none; margin-top:1.5rem; border-top:1px solid var(--border); padding-top:1rem;">
      <div class="muted" style="margin-bottom:.5rem;">Export a combined report for the whole playlist (can take a while — one fetch per video, more if summaries are on):</div>
      <div class="row">
        <select id="export-format">
          <option value="json">JSON</option>
          <option value="csv">CSV</option>
          <option value="md">Markdown</option>
        </select>
        <select id="export-dl-format">
          <option value="none">Don't download videos</option>
          <option value="mp3">Also download all as MP3</option>
          <option value="mp4">Also download all as MP4</option>
        </select>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="export-transcript" checked> <label for="export-transcript">Include transcripts</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="export-summary"> <label for="export-summary">Include AI summaries (slower)</label>
      </div>
      <button onclick="doPlaylistExport()">Generate Report</button>
      <div class="result" id="export-result"></div>
    </div>
  </div>

  <!-- TRANSCRIPT -->
  <div class="panel" id="panel-transcript">
    <input type="text" id="tr-url" placeholder="Video URL">
    <div class="checkbox-row">
      <input type="checkbox" id="tr-timestamps"> <label for="tr-timestamps">Include timestamps</label>
    </div>
    <div class="row">
      <button id="tr-btn" onclick="doTranscript()">Get Transcript</button>
      <button id="tr-summarize-btn" class="secondary" onclick="doSummarize()">Summarize with AI</button>
    </div>
    <div class="result" id="tr-result"></div>
  </div>

  <footer>Made with <span class="heart">💛</span> by Rounak</footer>
</div>

<script>
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('panel-' + t.dataset.tab).classList.add('active');
});

function spinner(label) {
  return `<span class="spinner"></span>${label}`;
}

async function post(url, body) {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  return r.json();
}

// --- Click-lock helpers ---------------------------------------------------
// Prevents the "click twice, two API calls fire" bug: a button is disabled
// the instant it's clicked (so a burst of clicks before the response comes
// back only ever fires one request), and on SUCCESS it stays disabled with
// a "done" label until the linked URL field's contents change — the
// signal that a new request is actually wanted. On error it re-enables
// immediately so the same click can just be retried.
function lock(btn, label) {
  if (!btn.dataset.origText) btn.dataset.origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = label;
}
function unlock(btn) {
  btn.disabled = false;
  btn.textContent = btn.dataset.origText || btn.textContent;
}
function lockDone(btn, label) {
  btn.disabled = true;
  btn.textContent = label;
}
function bindUrlUnlock(inputId, btnIds) {
  document.getElementById(inputId).addEventListener('input', () => {
    btnIds.forEach(id => unlock(document.getElementById(id)));
  });
}
bindUrlUnlock('dl-url', ['dl-btn']);
bindUrlUnlock('info-url', ['info-btn', 'info-dl-mp4-btn', 'info-dl-mp3-btn']);
bindUrlUnlock('tr-url', ['tr-btn', 'tr-summarize-btn']);

// Renders real, clickable download links. The server already sends these
// files with Content-Disposition: attachment, so clicking one triggers a
// normal browser "save to device" download — same as downloading anything
// else off the web, and it works the same after this is deployed.
function renderDownloadLinks(files) {
  if (!files || !files.length) return '<p class="muted">No files were produced.</p>';
  return `<div class="success-pop">` +
    files.map(f => `<div>✅ <a href="${f.url}" download>${f.name}</a></div>`).join('') +
    `</div>`;
}

function downloadTextFile(filename, text) {
  const blob = new Blob([text], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// --- Download tab -----------------------------------------------------
async function doDownload() {
  const btn = document.getElementById('dl-btn');
  if (btn.disabled) return;
  lock(btn, 'Downloading...');
  const el = document.getElementById('dl-result');
  el.innerHTML = spinner('Downloading — this can take a while for long videos or playlists...');
  const data = await post('/api/download', {
    url: document.getElementById('dl-url').value,
    format: document.getElementById('dl-format').value,
    quality: document.getElementById('dl-quality').value,
  });
  if (data.error) { el.innerHTML = 'Error: ' + data.error; unlock(btn); return; }
  el.innerHTML = renderDownloadLinks(data.files);
  lockDone(btn, 'Done — edit the URL to download again');
}

// --- Info tab -----------------------------------------------------------
async function doInfo() {
  const btn = document.getElementById('info-btn');
  if (btn.disabled) return;
  lock(btn, 'Loading...');
  const el = document.getElementById('info-result');
  el.innerHTML = spinner('Loading...');
  const data = await post('/api/info', {url: document.getElementById('info-url').value});
  if (data.error) { el.innerHTML = 'Error: ' + data.error; unlock(btn); return; }
  el.innerHTML = `
    <h3>${data.title}</h3>
    <p class="muted">${data.channel} · ${data.duration_str} · ${data.upload_date}</p>
    <p>Views: ${data.view_count ?? 'n/a'} · Likes: ${data.like_count ?? 'n/a'} · Comments: ${data.comment_count ?? 'n/a'}</p>
    <p class="muted">Captions available: ${data.has_captions}</p>
    <pre>${(data.description||'').slice(0,1000)}</pre>
  `;
  lockDone(btn, 'Done — edit the URL to reload');
}

async function doInfoDownload(fmt) {
  const btn = document.getElementById(fmt === 'mp4' ? 'info-dl-mp4-btn' : 'info-dl-mp3-btn');
  if (btn.disabled) return;
  lock(btn, 'Downloading...');
  const el = document.getElementById('info-result');
  const msg = document.createElement('div');
  msg.innerHTML = `Downloading (${fmt})...`;
  el.appendChild(msg);
  const data = await post('/api/download', {url: document.getElementById('info-url').value, format: fmt, quality: 'best'});
  if (data.error) { msg.innerHTML = 'Error: ' + data.error; unlock(btn); return; }
  msg.innerHTML = renderDownloadLinks(data.files);
  lockDone(btn, 'Done — edit the URL to download again');
}

// --- Playlist tab ---------------------------------------------------------
let playlistVideos = [];

async function doPlaylist() {
  const el = document.getElementById('pl-result');
  el.innerHTML = spinner('Loading...');
  document.getElementById('pl-export').style.display = 'none';
  const data = await post('/api/playlist', {url: document.getElementById('pl-url').value});
  if (data.error) { el.innerHTML = 'Error: ' + data.error; return; }

  playlistVideos = data.videos;
  let rows = data.videos.map((v, idx) => `
    <tr>
      <td>${v.duration_str}</td>
      <td>${v.title}</td>
      <td style="white-space:nowrap;">
        <button class="secondary" style="padding:.25rem .5rem; font-size:.75rem;" onclick="rowDownload(event, ${idx}, 'mp4')">MP4</button>
        <button class="secondary" style="padding:.25rem .5rem; font-size:.75rem;" onclick="rowDownload(event, ${idx}, 'mp3')">MP3</button>
        <button class="secondary" style="padding:.25rem .5rem; font-size:.75rem;" onclick="rowTranscript(event, ${idx})">Transcript</button>
        <button class="secondary" style="padding:.25rem .5rem; font-size:.75rem;" onclick="rowSummary(event, ${idx})">Summary</button>
      </td>
    </tr>
    <tr id="pl-row-result-${idx}"><td colspan="3" style="border-bottom:none; padding-top:0;"></td></tr>`).join('');

  el.innerHTML = `
    <h3>${data.playlist_title}</h3>
    <p class="muted">${data.video_count} videos · total ${data.total_duration_str}</p>
    <table><thead><tr><th>Duration</th><th>Title</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table>
  `;
  document.getElementById('pl-export').style.display = 'block';
}

async function rowDownload(evt, idx, fmt) {
  const btn = evt.currentTarget;
  if (btn.disabled) return;
  const v = playlistVideos[idx];
  const origLabel = btn.textContent;
  btn.disabled = true; btn.textContent = '...';
  const cell = document.querySelector(`#pl-row-result-${idx} td`);
  cell.innerHTML = `<span class="muted">Downloading (${fmt}): ${v.title}...</span>`;
  const data = await post('/api/download', {url: v.url, format: fmt, quality: 'best'});
  cell.innerHTML = data.error ? `<span class="muted">Error: ${data.error}</span>` : renderDownloadLinks(data.files);
  btn.disabled = false; btn.textContent = origLabel;
}

async function rowTranscript(evt, idx) {
  const btn = evt.currentTarget;
  if (btn.disabled) return;
  btn.disabled = true;
  const v = playlistVideos[idx];
  document.querySelector('.tab[data-tab="transcript"]').click();
  document.getElementById('tr-url').value = v.url;
  unlock(document.getElementById('tr-btn'));
  await doTranscript();
  btn.disabled = false;
}

async function rowSummary(evt, idx) {
  const btn = evt.currentTarget;
  if (btn.disabled) return;
  btn.disabled = true;
  const v = playlistVideos[idx];
  document.querySelector('.tab[data-tab="transcript"]').click();
  document.getElementById('tr-url').value = v.url;
  unlock(document.getElementById('tr-btn'));
  unlock(document.getElementById('tr-summarize-btn'));
  await doTranscript();
  await doSummarize();
  btn.disabled = false;
}

async function doPlaylistExport() {
  const btn = document.querySelector('#pl-export button');
  if (btn.disabled) return;
  lock(btn, 'Building report...');
  const el = document.getElementById('export-result');
  const dlFormat = document.getElementById('export-dl-format').value;
  el.innerHTML = spinner('Building report... this can take a while for long playlists.');

  const reportData = await post('/api/playlist/report', {
    url: document.getElementById('pl-url').value,
    include_transcript: document.getElementById('export-transcript').checked,
    include_summary: document.getElementById('export-summary').checked,
    format: document.getElementById('export-format').value,
  });
  if (reportData.error) { el.innerHTML = 'Error: ' + reportData.error; unlock(btn); return; }
  el.innerHTML = `✅ Report ready: <a href="${reportData.url}" download>${reportData.file}</a>`;

  if (dlFormat !== 'none') {
    el.innerHTML += '<br>Downloading all videos, this can take a while...';
    const dlData = await post('/api/download', {
      url: document.getElementById('pl-url').value, format: dlFormat, quality: 'best'
    });
    el.innerHTML += '<br>' + (dlData.error ? `Download error: ${dlData.error}` : renderDownloadLinks(dlData.files));
  }
  lockDone(btn, 'Done — change the playlist URL to run again');
}

// --- Transcript tab ---------------------------------------------------
let lastTranscript = '';
let lastSummary = '';

async function doTranscript() {
  const btn = document.getElementById('tr-btn');
  if (btn.disabled) return;
  lock(btn, 'Loading...');
  const el = document.getElementById('tr-result');
  el.innerHTML = spinner('Loading...');
  const data = await post('/api/transcript', {
    url: document.getElementById('tr-url').value,
    timestamps: document.getElementById('tr-timestamps').checked
  });
  if (data.error || data.available === false) {
    el.innerHTML = 'Error: ' + (data.error || data.reason);
    unlock(btn);
    return;
  }
  lastTranscript = data.text;
  el.innerHTML = `
    <p class="muted">${data.language} (${data.is_generated ? 'auto' : 'manual'})</p>
    <pre>${data.text}</pre>
    <button class="secondary" onclick="downloadTextFile('transcript.txt', lastTranscript)">Download transcript (.txt)</button>
  `;
  lockDone(btn, 'Done — edit the URL to fetch again');
}

async function doSummarize() {
  const btn = document.getElementById('tr-summarize-btn');
  if (btn.disabled) return;
  if (!lastTranscript) { alert('Get a transcript first.'); return; }
  lock(btn, 'Summarizing...');
  const el = document.getElementById('tr-result');
  const msg = document.createElement('div');
  msg.className = 'muted';
  msg.textContent = 'Summarizing...';
  el.appendChild(msg);
  const data = await post('/api/summarize', {text: lastTranscript});
  if (data.error) { msg.textContent = 'Error: ' + data.error; unlock(btn); return; }
  lastSummary = data.summary;
  msg.outerHTML = `
    <h4>Summary</h4>
    <pre>${data.summary}</pre>
    <button class="secondary" onclick="downloadTextFile('summary.txt', lastSummary)">Download summary (.txt)</button>
  `;
  lockDone(btn, 'Done — edit the URL to summarize again');
}
</script>
</body>
</html>
